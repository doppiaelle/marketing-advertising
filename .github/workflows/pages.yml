name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify static product pages
        shell: bash
        run: |
          set -euo pipefail
          for page in index ll-platform acn focus secura kritoma feeddy brief2done; do
            if [ "$page" = "index" ]; then
              test -f public/index.html
            else
              test -f "public/$page/index.html"
            fi
          done
          test -f public/assets/product-pages.css
          test -f public/assets/product-pages.js
          test -f public/assets/ll-platform.css
          test -f public/assets/feeddy.css
          test -f public/assets/feeddy.js
          test -f public/assets/feeddy/motion.js
          test -f public/assets/feeddy/feeddy-logo.png
          test -f public/assets/kritoma.css
          test -f public/assets/kritoma.js
          test -f public/assets/kritoma/extra-art.webp
          node --check public/assets/kritoma.js
          test -f public/assets/brief2done/brief2done-icon.png
          test -f public/assets/brief2done/frame.html
          test -f public/assets/brief2done/frame.css
          test -f public/assets/ui-icons.css
          test -f public/assets/brief2done/motion.css
          test -f public/assets/brief2done/showcase.css
          test -f public/assets/brief2done/screens.css
          test -f public/assets/brief2done/inter.woff2
          test -f public/assets/brief2done/plus-jakarta-sans.woff2
          node --check public/assets/brief2done/motion.js
          node --check public/assets/brief2done/screens.js
          node scripts/check-brief2done.mjs
          node scripts/check-contact-links.mjs
          ! grep -RniE '<video|intro\.mp4|Access Studio|Sign in with GitHub|Local access' public/ll-platform
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
