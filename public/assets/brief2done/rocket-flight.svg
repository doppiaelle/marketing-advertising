<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 220" role="img" aria-labelledby="rocket-title">
<title id="rocket-title">Brief2Done rocket with a complete tapered flame</title>
<defs>
 <linearGradient id="shell" x1="0" x2="1" y1=".2" y2=".85"><stop stop-color="#b3f4ff"/><stop offset=".24" stop-color="#ffffff"/><stop offset=".60" stop-color="#f7fffc"/><stop offset="1" stop-color="#70b9cc"/></linearGradient>
 <linearGradient id="fin" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0bd6c0"/><stop offset=".30" stop-color="#007e86"/><stop offset=".7" stop-color="#00384a"/><stop offset="1" stop-color="#001f31"/></linearGradient>
 <linearGradient id="flame" x1=".28" y1="0" x2=".69" y2="1"><stop stop-color="#fff7a8"/><stop offset=".13" stop-color="#ffdf2a"/><stop offset=".40" stop-color="#ff7920"/><stop offset=".72" stop-color="#ff2d09"/><stop offset="1" stop-color="#f50021"/></linearGradient>
 <linearGradient id="flame-core" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#fff"/><stop offset=".18" stop-color="#ffff9b"/><stop offset=".63" stop-color="#ffd237"/><stop offset="1" stop-color="#ff8a09"/></linearGradient>
 <radialGradient id="window" cx=".3" cy=".25" r=".8"><stop stop-color="#c3ffc6"/><stop offset=".27" stop-color="#58fd54"/><stop offset=".55" stop-color="#00da84"/><stop offset="1" stop-color="#00656e"/></radialGradient>
 <linearGradient id="nose" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#16b8b6"/><stop offset=".4" stop-color="#006c75"/><stop offset="1" stop-color="#002b3f"/></linearGradient>
 <filter id="glow" x="-60%" y="-50%" width="220%" height="210%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<!-- Entire cone flame: an unbroken silhouette ending at a single tip. -->
<path d="M45 148 C31 168 40 185 51 201 C56 209 59 216 60 219 C61 215 65 205 72 195 C84 175 87 161 75 148 Z" fill="#ff6b1b" opacity=".42" filter="url(#glow)"/>
<path d="M45 146 C38 162 41 178 49 194 C56 206 59 215 60 219 C62 211 66 202 73 191 C82 176 83 158 75 146 Q60 154 45 146 Z" fill="url(#flame)"/>
<path d="M53 151 C50 167 52 179 57 195 Q59 202 60 208 C61 195 70 177 68 152 Z" fill="url(#flame-core)"/>
<path d="M56 152 Q57 177 60 189 Q64 172 65 152 Z" fill="#fffce0" opacity=".85"/>
<!-- The fins retain the deep teal of the original mark. -->
<path d="M40 92 C20 99 10 118 7 149 C17 145 29 145 43 144 L51 123 Z" fill="url(#fin)" stroke="#12b4aa" stroke-width="2"/>
<path d="M80 92 C100 99 110 118 113 149 C103 145 91 145 77 144 L69 123 Z" fill="url(#fin)" stroke="#10a7a9" stroke-width="2"/>
<path d="M34 117 C20 126 16 135 13 143" fill="none" stroke="#67fbdd" stroke-width="3" opacity=".48"/>
<path d="M86 117 C100 126 104 135 107 143" fill="none" stroke="#009fab" stroke-width="3" opacity=".7"/>
<!-- Main fuselage, pointed upward and fully closed at the nozzle. -->
<path d="M60 6 C36 26 29 57 30 88 C30 112 36 135 46 151 Q60 163 74 151 C84 135 90 112 90 88 C91 57 84 26 60 6 Z" fill="url(#shell)" stroke="#003f4c" stroke-width="3" stroke-linejoin="round"/>
<path d="M60 6 C42 21 35 42 32 63 Q60 55 88 63 C85 42 78 21 60 6 Z" fill="url(#nose)"/>
<path d="M38 73 C37 106 41 133 52 150" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".7"/>
<path d="M83 68 C86 102 79 129 71 146" fill="none" stroke="#1c899c" stroke-width="5" stroke-linecap="round" opacity=".24"/>
<circle cx="60" cy="89" r="21" fill="#042a39" stroke="#071c2c" stroke-width="3"/>
<circle cx="60" cy="89" r="15.5" fill="url(#window)"/>
<ellipse cx="54" cy="82" rx="7" ry="4" transform="rotate(-34 54 82)" fill="#ecffe6" opacity=".95"/>
<path d="M42 129 Q60 141 78 129 L74 151 Q60 163 46 151 Z" fill="url(#nose)" stroke="#002b41" stroke-width="2"/>
<path d="M50 151 Q60 156 70 151" fill="none" stroke="#15f0cc" stroke-width="3" opacity=".75"/>
</svg>